---
# role: postgresql
# file: tasks/config.yml

- name: "PostgreSQL | Ensure managed configuration directory exists"
  ansible.builtin.file:
    path: "{{ __postgresql_config_dir }}/conf.d"
    state: directory
    owner: "{{ __postgresql_user }}"
    group: "{{ __postgresql_group }}"
    mode: "0750"
  tags:
    - postgresql_config

- name: "PostgreSQL | Ensure PostgreSQL includes managed configuration directory"
  ansible.builtin.lineinfile:
    path: "{{ __postgresql_config_dir }}/postgresql.conf"
    regexp: '^#?include_dir\s*=.*$'
    line: "include_dir = 'conf.d'"
    owner: "{{ __postgresql_user }}"
    group: "{{ __postgresql_group }}"
    mode: "0600"
  notify:
    - Validate postgresql configuration
    - Reload postgresql
  tags:
    - postgresql_config

- name: "PostgreSQL | Configure restart-scoped settings"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ __postgresql_config_dir }}/conf.d/{{ item.dest }}"
    owner: "{{ __postgresql_user }}"
    group: "{{ __postgresql_group }}"
    mode: "0600"
  loop: "{{ __postgresql_config_restart_templates }}"
  notify:
    - Validate postgresql configuration
    - Restart postgresql
  tags:
    - postgresql_config

- name: "PostgreSQL | Configure reload-scoped settings"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ __postgresql_config_dir }}/conf.d/{{ item.dest }}"
    owner: "{{ __postgresql_user }}"
    group: "{{ __postgresql_group }}"
    mode: "0600"
  loop: "{{ __postgresql_config_reload_templates }}"
  notify:
    - Validate postgresql configuration
    - Reload postgresql
  tags:
    - postgresql_config
