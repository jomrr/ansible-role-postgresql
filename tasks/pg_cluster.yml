---
# role: postgresql
# file: tasks/pg_cluster.yml

- name: "POSTGRESQL | Read Debian PostgreSQL binary directory"
  ansible.builtin.command:
    cmd: "{{ __postgresql_pg_config_bin }} --bindir"
  register: __postgresql_pg_config
  changed_when: false
  check_mode: false
  when: __postgresql_cluster_provider == "postgresql_common"

- name: "POSTGRESQL | Initialize Debian main cluster with pg_createcluster"
  become: true
  become_user: root
  ansible.builtin.command:
    argv:
      - /usr/bin/pg_createcluster
      - "--locale={{ postgresql_cluster_locale }}"
      - "--encoding={{ postgresql_cluster_encoding }}"
      - "{{ __postgresql_major_version }}"
      - "{{ __postgresql_cluster_name }}"
    creates: "{{ __postgresql_data_dir }}/PG_VERSION"
  when: __postgresql_cluster_provider == "postgresql_common"

- name: "POSTGRESQL | Initialize PostgreSQL cluster with postgresql-setup"
  become: true
  become_user: root
  ansible.builtin.command:
    cmd: "{{ __postgresql_setup_bin }} --initdb"
    creates: "{{ __postgresql_data_dir }}/PG_VERSION"
  environment:
    PGSETUP_INITDB_OPTIONS: >-
      {{ ('--locale=' ~ postgresql_cluster_locale) | quote }}
      {{ ('--encoding=' ~ postgresql_cluster_encoding) | quote }}
  when: __postgresql_cluster_provider == "postgresql_setup"
  tags:
    - postgresql_cluster

- name: "POSTGRESQL | Ensure PostgreSQL data directory exists"
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __postgresql_data_dir }}"
    state: directory
    owner: "{{ __postgresql_user }}"
    group: "{{ __postgresql_group }}"
    mode: "0700"
  when: __postgresql_cluster_provider == "initdb"
  tags:
    - postgresql_cluster

- name: "POSTGRESQL | Initialize PostgreSQL cluster with initdb"
  become: true
  become_user: "{{ __postgresql_user }}"
  ansible.builtin.command:
    argv:
      - "{{ __postgresql_bin_dir }}/initdb"
      - -D
      - "{{ __postgresql_data_dir }}"
      - "--locale={{ postgresql_cluster_locale }}"
      - "--encoding={{ postgresql_cluster_encoding }}"
    creates: "{{ __postgresql_data_dir }}/PG_VERSION"
  when: __postgresql_cluster_provider == "initdb"
  tags:
    - postgresql_cluster
