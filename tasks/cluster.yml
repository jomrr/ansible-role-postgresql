---
# role: postgresql
# file: tasks/cluster.yml

- name: "PostgreSQL | Discover postgresql-common clusters"
  ansible.builtin.command:
    cmd: "{{ __postgresql_pg_lsclusters_bin }} --no-header"
  register: __postgresql_pg_lsclusters_result
  changed_when: false
  failed_when: false
  check_mode: false
  when: __postgresql_cluster_provider == "postgresql_common"
  tags:
    - postgresql_cluster

- name: "PostgreSQL | Select postgresql-common cluster"
  ansible.builtin.set_fact:
    __postgresql_cluster_line: >-
      {{
        __postgresql_pg_lsclusters_result.stdout_lines
        | select('search', '^[0-9]+[ ]+' ~ __postgresql_cluster_name ~ '[ ]+')
        | list
        | first
        | default('')
      }}
  when: __postgresql_cluster_provider == "postgresql_common"
  tags:
    - postgresql_cluster

- name: "PostgreSQL | Assert postgresql-common cluster exists"
  ansible.builtin.assert:
    that:
      - __postgresql_cluster_line | length > 0
    fail_msg: >-
      No PostgreSQL cluster named '{{ __postgresql_cluster_name }}' exists.
      postgresql-common packages should normally create the default main cluster.
  when: __postgresql_cluster_provider == "postgresql_common"
  tags:
    - postgresql_cluster

- name: "PostgreSQL | Set postgresql-common cluster facts"
  ansible.builtin.set_fact:
    __postgresql_data_dir: "{{ __postgresql_cluster_line.split()[5] }}"
    __postgresql_config_dir: "/etc/postgresql/{{ __postgresql_cluster_line.split()[0] }}/{{ __postgresql_cluster_name }}"
    __postgresql_bin_dir: "/usr/lib/postgresql/{{ __postgresql_cluster_line.split()[0] }}/bin"
    __postgresql_service_name: "postgresql@{{ __postgresql_cluster_line.split()[0] }}-{{ __postgresql_cluster_name }}"
  when: __postgresql_cluster_provider == "postgresql_common"
  tags:
    - postgresql_cluster

- name: "PostgreSQL | Initialize PostgreSQL cluster with postgresql-setup"
  ansible.builtin.command:
    cmd: "{{ __postgresql_setup_bin }} --initdb"
    creates: "{{ __postgresql_data_dir }}/PG_VERSION"
  when: __postgresql_cluster_provider == "postgresql_setup"
  tags:
    - postgresql_cluster

- name: "PostgreSQL | Ensure PostgreSQL data directory exists"
  ansible.builtin.file:
    path: "{{ __postgresql_data_dir }}"
    state: directory
    owner: "{{ __postgresql_user }}"
    group: "{{ __postgresql_group }}"
    mode: "0700"
  when: __postgresql_cluster_provider == "initdb"
  tags:
    - postgresql_cluster

- name: "PostgreSQL | Initialize PostgreSQL cluster with initdb"
  ansible.builtin.command:
    cmd: "{{ __postgresql_bin_dir }}/initdb -D {{ __postgresql_data_dir }}"
    creates: "{{ __postgresql_data_dir }}/PG_VERSION"
  become: true
  become_user: "{{ __postgresql_user }}"
  when: __postgresql_cluster_provider == "initdb"
  tags:
    - postgresql_cluster
