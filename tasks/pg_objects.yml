---
# role: postgresql
# file: tasks/pg_objects.yml

- name: "POSTGRESQL | Manage roles"
  become: true
  become_user: "{{ __postgresql_user }}"
  no_log: "{{ postgresql_no_log }}"
  community.postgresql.postgresql_user:
    name: "{{ __postgresql_object.name }}"
    state: "{{ __postgresql_object.state | default('present') }}"
    login_db: "{{ __postgresql_object.login_db | default(omit) }}"
    password: "{{ __postgresql_object.password | default(omit) }}"
    encrypted: "{{ __postgresql_object.encrypted | default(omit) }}"
    role_attr_flags: "{{ __postgresql_object.role_attr_flags | default(omit) }}"
    conn_limit: "{{ __postgresql_object.conn_limit | default(omit) }}"
    expires: "{{ __postgresql_object.expires | default(omit) }}"
    comment: "{{ __postgresql_object.comment | default(omit) }}"
    configuration: "{{ __postgresql_object.configuration | default(omit) }}"
    reset_unspecified_configuration: "{{ __postgresql_object.reset_unspecified_configuration | default(omit) }}"
    fail_on_user: "{{ __postgresql_object.fail_on_user | default(omit) }}"
    no_password_changes: "{{ __postgresql_object.no_password_changes | default(omit) }}"
    login_unix_socket: "{{ __postgresql_object.login_unix_socket | default(omit) }}"
    login_port: "{{ __postgresql_object.login_port | default(postgresql_port) }}"
    login_user: "{{ __postgresql_object.login_user | default(omit) }}"
    login_password: "{{ __postgresql_object.login_password | default(omit) }}"
    login_host: "{{ __postgresql_object.login_host | default(omit) }}"
    ssl_mode: "{{ __postgresql_object.ssl_mode | default(omit) }}"
    trust_input: false
  loop: "{{ postgresql_roles }}"
  loop_control:
    loop_var: __postgresql_object
    label: "{{ __postgresql_object.name }}"
  tags:
    - postgresql_roles
    - postgresql_objects

- name: "POSTGRESQL | Manage role memberships"
  become: true
  become_user: "{{ __postgresql_user }}"
  no_log: "{{ postgresql_no_log | bool and __postgresql_object.login_password is defined }}"
  community.postgresql.postgresql_membership:
    groups: "{{ __postgresql_object.groups | default(__postgresql_object.group | default(omit)) }}"
    target_roles: "{{ __postgresql_object.target_roles }}"
    state: "{{ __postgresql_object.state | default('present') }}"
    fail_on_role: "{{ __postgresql_object.fail_on_role | default(omit) }}"
    login_db: "{{ __postgresql_object.login_db | default(omit) }}"
    login_unix_socket: "{{ __postgresql_object.login_unix_socket | default(omit) }}"
    login_port: "{{ __postgresql_object.login_port | default(postgresql_port) }}"
    login_user: "{{ __postgresql_object.login_user | default(omit) }}"
    login_password: "{{ __postgresql_object.login_password | default(omit) }}"
    login_host: "{{ __postgresql_object.login_host | default(omit) }}"
    ssl_mode: "{{ __postgresql_object.ssl_mode | default(omit) }}"
    trust_input: false
  loop: "{{ postgresql_memberships }}"
  loop_control:
    loop_var: __postgresql_object
    label: >-
      {{ __postgresql_object.target_roles | join(', ') }} ->
      {{ (__postgresql_object.groups | default(__postgresql_object.group)) | join(', ') }}
  tags:
    - postgresql_memberships
    - postgresql_objects

- name: "POSTGRESQL | Ensure tablespace directories exist"
  ansible.builtin.file:
    path: "{{ __postgresql_directory.location }}"
    state: directory
    owner: "{{ __postgresql_directory.directory_owner | default(__postgresql_user) }}"
    group: "{{ __postgresql_directory.directory_group | default(__postgresql_group) }}"
    mode: "{{ __postgresql_directory.directory_mode | default('0700') }}"
  loop: >-
    {{ postgresql_tablespaces | map('dict2items')
       | map('selectattr', 'key', 'in', ['name', 'location', 'state', 'directory_owner', 'directory_group', 'directory_mode'])
       | map('items2dict') }}
  loop_control:
    loop_var: __postgresql_directory
    label: "{{ __postgresql_directory.name }}"
  when:
    - __postgresql_directory.location is defined
    - __postgresql_directory.state | default('present') != 'absent'
  tags:
    - postgresql_tablespaces
    - postgresql_objects

- name: "POSTGRESQL | Manage tablespaces"
  become: true
  become_user: "{{ __postgresql_user }}"
  no_log: "{{ postgresql_no_log | bool and __postgresql_object.login_password is defined }}"
  community.postgresql.postgresql_tablespace:
    tablespace: "{{ __postgresql_object.name }}"
    state: "{{ __postgresql_object.state | default('present') }}"
    location: "{{ __postgresql_object.location | default(omit) }}"
    owner: "{{ __postgresql_object.owner | default(omit) }}"
    set: "{{ __postgresql_object.set | default(omit) }}"
    login_db: "{{ __postgresql_object.login_db | default(omit) }}"
    login_unix_socket: "{{ __postgresql_object.login_unix_socket | default(omit) }}"
    login_port: "{{ __postgresql_object.login_port | default(postgresql_port) }}"
    login_user: "{{ __postgresql_object.login_user | default(omit) }}"
    login_password: "{{ __postgresql_object.login_password | default(omit) }}"
    login_host: "{{ __postgresql_object.login_host | default(omit) }}"
    ssl_mode: "{{ __postgresql_object.ssl_mode | default(omit) }}"
    trust_input: false
  loop: "{{ postgresql_tablespaces }}"
  loop_control:
    loop_var: __postgresql_object
    label: "{{ __postgresql_object.name }}"
  tags:
    - postgresql_tablespaces
    - postgresql_objects

- name: "POSTGRESQL | Manage databases"
  become: true
  become_user: "{{ __postgresql_user }}"
  no_log: "{{ postgresql_no_log | bool and __postgresql_object.login_password is defined }}"
  community.postgresql.postgresql_db:
    name: "{{ __postgresql_object.name }}"
    state: "{{ __postgresql_object.state | default('present') }}"
    owner: "{{ __postgresql_object.owner | default(omit) }}"
    encoding: "{{ __postgresql_object.encoding | default(omit) }}"
    lc_collate: "{{ __postgresql_object.lc_collate | default(omit) }}"
    lc_ctype: "{{ __postgresql_object.lc_ctype | default(omit) }}"
    locale_provider: "{{ __postgresql_object.locale_provider | default(omit) }}"
    icu_locale: "{{ __postgresql_object.icu_locale | default(omit) }}"
    template: "{{ __postgresql_object.template | default(omit) }}"
    tablespace: "{{ __postgresql_object.tablespace | default(omit) }}"
    conn_limit: "{{ __postgresql_object.conn_limit | default(omit) }}"
    comment: "{{ __postgresql_object.comment | default(omit) }}"
    force: "{{ __postgresql_object.force | default(omit) }}"
    maintenance_db: "{{ __postgresql_object.maintenance_db | default(omit) }}"
    login_unix_socket: "{{ __postgresql_object.login_unix_socket | default(omit) }}"
    login_port: "{{ __postgresql_object.login_port | default(postgresql_port) }}"
    login_user: "{{ __postgresql_object.login_user | default(omit) }}"
    login_password: "{{ __postgresql_object.login_password | default(omit) }}"
    login_host: "{{ __postgresql_object.login_host | default(omit) }}"
    ssl_mode: "{{ __postgresql_object.ssl_mode | default(omit) }}"
    trust_input: false
  loop: "{{ postgresql_databases }}"
  loop_control:
    loop_var: __postgresql_object
    label: "{{ __postgresql_object.name }}"
  tags:
    - postgresql_databases
    - postgresql_objects

- name: "POSTGRESQL | Manage extensions"
  become: true
  become_user: "{{ __postgresql_user }}"
  no_log: "{{ postgresql_no_log | bool and __postgresql_object.login_password is defined }}"
  community.postgresql.postgresql_ext:
    name: "{{ __postgresql_object.name }}"
    state: "{{ __postgresql_object.state | default('present') }}"
    login_db: "{{ __postgresql_object.database }}"
    schema: "{{ __postgresql_object.schema | default(omit) }}"
    version: "{{ __postgresql_object.version | default(omit) }}"
    cascade: "{{ __postgresql_object.cascade | default(omit) }}"
    comment: "{{ __postgresql_object.comment | default(omit) }}"
    login_unix_socket: "{{ __postgresql_object.login_unix_socket | default(omit) }}"
    login_port: "{{ __postgresql_object.login_port | default(postgresql_port) }}"
    login_user: "{{ __postgresql_object.login_user | default(omit) }}"
    login_password: "{{ __postgresql_object.login_password | default(omit) }}"
    login_host: "{{ __postgresql_object.login_host | default(omit) }}"
    ssl_mode: "{{ __postgresql_object.ssl_mode | default(omit) }}"
    trust_input: false
  loop: "{{ postgresql_extensions }}"
  loop_control:
    loop_var: __postgresql_object
    label: "{{ __postgresql_object.database }}: {{ __postgresql_object.name }}"
  tags:
    - postgresql_extensions
    - postgresql_objects

- name: "POSTGRESQL | Manage logical replication publications"
  become: true
  become_user: "{{ __postgresql_user }}"
  no_log: "{{ postgresql_no_log | bool and __postgresql_object.login_password is defined }}"
  community.postgresql.postgresql_publication:
    name: "{{ __postgresql_object.name }}"
    state: "{{ __postgresql_object.state | default('present') }}"
    login_db: "{{ __postgresql_object.database }}"
    owner: "{{ __postgresql_object.owner | default(omit) }}"
    tables: "{{ __postgresql_object.tables | default(omit) }}"
    tables_in_schema: "{{ __postgresql_object.tables_in_schema | default(omit) }}"
    columns: "{{ __postgresql_object.columns | default(omit) }}"
    rowfilters: "{{ __postgresql_object.rowfilters | default(omit) }}"
    parameters: "{{ __postgresql_object.parameters | default(omit) }}"
    comment: "{{ __postgresql_object.comment | default(omit) }}"
    cascade: "{{ __postgresql_object.cascade | default(omit) }}"
    login_unix_socket: "{{ __postgresql_object.login_unix_socket | default(omit) }}"
    login_port: "{{ __postgresql_object.login_port | default(postgresql_port) }}"
    login_user: "{{ __postgresql_object.login_user | default(omit) }}"
    login_password: "{{ __postgresql_object.login_password | default(omit) }}"
    login_host: "{{ __postgresql_object.login_host | default(omit) }}"
    ssl_mode: "{{ __postgresql_object.ssl_mode | default(omit) }}"
    trust_input: false
  loop: "{{ postgresql_publications }}"
  loop_control:
    loop_var: __postgresql_object
    label: "{{ __postgresql_object.database }}: {{ __postgresql_object.name }}"
  tags:
    - postgresql_publications
    - postgresql_objects

- name: "POSTGRESQL | Manage logical replication subscriptions"
  become: true
  become_user: "{{ __postgresql_user }}"
  no_log: "{{ postgresql_no_log | bool }}"
  community.postgresql.postgresql_subscription:
    name: "{{ __postgresql_object.name }}"
    state: "{{ __postgresql_object.state | default('present') }}"
    login_db: "{{ __postgresql_object.database }}"
    connparams: "{{ __postgresql_object.connparams | default(omit) }}"
    publications: "{{ __postgresql_object.publications | default(omit) }}"
    owner: "{{ __postgresql_object.owner | default(omit) }}"
    subsparams: "{{ __postgresql_object.subsparams | default(omit) }}"
    cascade: "{{ __postgresql_object.cascade | default(omit) }}"
    login_unix_socket: "{{ __postgresql_object.login_unix_socket | default(omit) }}"
    login_port: "{{ __postgresql_object.login_port | default(postgresql_port) }}"
    login_user: "{{ __postgresql_object.login_user | default(omit) }}"
    login_password: "{{ __postgresql_object.login_password | default(omit) }}"
    login_host: "{{ __postgresql_object.login_host | default(omit) }}"
    ssl_mode: "{{ __postgresql_object.ssl_mode | default(omit) }}"
    trust_input: false
  loop: "{{ postgresql_subscriptions }}"
  loop_control:
    loop_var: __postgresql_object
    label: "{{ __postgresql_object.database }}: {{ __postgresql_object.name }}"
  tags:
    - postgresql_subscriptions
    - postgresql_objects
