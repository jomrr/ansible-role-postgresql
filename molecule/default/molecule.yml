---
# role: postgresql
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  inventory:
    group_vars:
      all:
        postgresql_port: 5433
        postgresql_shared_buffers: "128MB"
        postgresql_effective_cache_size: "512MB"
        postgresql_work_mem: "4MB"
        postgresql_maintenance_work_mem: "64MB"
        postgresql_autovacuum_work_mem: "64MB"
        postgresql_temp_file_limit: "256MB"
        postgresql_max_worker_processes: 2
        postgresql_max_parallel_workers: 1
        postgresql_max_wal_size: "512MB"
        postgresql_min_wal_size: "80MB"
        postgresql_roles:
          - name: "readonly"
            role_attr_flags: "NOLOGIN"
          - name: "app"
            role_attr_flags: "LOGIN"
        postgresql_databases:
          - name: "appdb"
            owner: "app"
            encoding: "UTF8"
        postgresql_extensions:
          - name: "pgcrypto"
            database: "appdb"
        postgresql_memberships:
          - groups:
              - "readonly"
            target_roles:
              - "app"
        postgresql_tablespaces:
          - name: "molecule_space"
            location: "/var/lib/pgsql/molecule-tablespace"
        postgresql_config_extra_reload:
          - name: "statement_timeout"
            value: "30s"
          - name: "lock_timeout"
            value: "5s"
        postgresql_config_extra_restart:
          - name: "max_prepared_transactions"
            value: 10
          - name: "max_locks_per_transaction"
            value: 128
        postgresql_pg_ident_entries:
          - map: "molecule"
            system_user: "root"
            database_user: "app"
        postgresql_hba_entries:
          - type: "local"
            database: "all"
            user: "postgres"
            method: "peer"
          - type: "local"
            database: "appdb"
            user: "app"
            method: "peer"
            options:
              - "map=molecule"
          - type: "host"
            database: "all"
            user: "all"
            address: "127.0.0.1/32"
            method: "scram-sha-256"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "cleanup"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "side_effect"
    - "converge"
    - "idempotence"
    - "verify"
    - "cleanup"
    - "destroy"
  name: "default"
platforms:
  - name: "postgresql"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    pre_build_image: true
    override_command: false
    systemd: true
