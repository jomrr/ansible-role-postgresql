---
# role: postgresql
# file: molecule/resources/playbooks/verify.yml

- name: "POSTGRESQL | Verify managed PostgreSQL behavior"
  hosts: all
  gather_facts: false
  become: true
  become_user: postgres
  module_defaults:
    community.postgresql.postgresql_query:
      login_db: postgres
      login_user: postgres
      login_port: 5433
  tasks:
    - name: "POSTGRESQL | Read effective configuration and object state"
      community.postgresql.postgresql_query:
        query: >-
          SELECT current_setting('port')::int AS port,
                 current_setting('statement_timeout') AS statement_timeout,
                 current_setting('lock_timeout') AS lock_timeout,
                 current_setting('max_prepared_transactions')::int AS prepared,
                 current_setting('max_locks_per_transaction')::int AS locks,
                 pg_has_role('app', 'readonly', 'member') AS membership,
                 (SELECT pg_tablespace_location(oid) FROM pg_tablespace
                  WHERE spcname = 'molecule_space') AS tablespace,
                 (SELECT count(*) FROM pg_file_settings WHERE error IS NOT NULL)
                 + (SELECT count(*) FROM pg_hba_file_rules WHERE error IS NOT NULL)
                 + (SELECT count(*) FROM pg_ident_file_mappings WHERE error IS NOT NULL)
                 + (SELECT count(*) FROM pg_settings WHERE pending_restart) AS errors
      register: __postgresql_verified
      changed_when: false

    - name: "POSTGRESQL | Assert managed configuration and objects are effective"
      ansible.builtin.assert:
        that:
          - __postgresql_verified.query_result[0].port == 5433
          - __postgresql_verified.query_result[0].statement_timeout == '30s'
          - __postgresql_verified.query_result[0].lock_timeout == '5s'
          - __postgresql_verified.query_result[0].prepared == 10
          - __postgresql_verified.query_result[0].locks == 128
          - __postgresql_verified.query_result[0].membership
          - __postgresql_verified.query_result[0].tablespace == '/var/lib/pgsql/molecule-tablespace'
          - __postgresql_verified.query_result[0].errors == 0
        quiet: true

    - name: "POSTGRESQL | Connect through the managed identity mapping"
      become_user: root
      community.postgresql.postgresql_query:
        login_db: appdb
        login_user: app
        query: >-
          SELECT current_user AS username,
                 EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pgcrypto') AS extension
      register: __postgresql_mapped_connection
      changed_when: false

    - name: "POSTGRESQL | Assert mapped login and extension are usable"
      ansible.builtin.assert:
        that:
          - __postgresql_mapped_connection.query_result[0].username == 'app'
          - __postgresql_mapped_connection.query_result[0].extension
        quiet: true
