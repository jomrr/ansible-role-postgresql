---
# role: postgresql
# file: defaults/main.yml

################################################################################
# Role behavior
################################################################################

# Suppress logs for PostgreSQL object tasks that may process credentials.
postgresql_no_log: true

################################################################################
# Network runtime
################################################################################

# Addresses PostgreSQL should listen on.
postgresql_listen_addresses:
  - "127.0.0.1"

# TCP port used by PostgreSQL and local management connections.
postgresql_port: 5432

################################################################################
# Connection limits
################################################################################

# Maximum number of concurrent PostgreSQL connections.
postgresql_max_connections: 50

# Connections reserved for PostgreSQL superusers.
postgresql_superuser_reserved_connections: 3

################################################################################
# Memory tuning
################################################################################

# Shared buffer size tuned for a small dedicated 8 GB VM profile.
postgresql_shared_buffers: "2GB"

# Planner cache estimate tuned for a small dedicated 8 GB VM profile.
postgresql_effective_cache_size: "6GB"

# Per-operation memory limit for sorts and hash operations.
postgresql_work_mem: "16MB"

# Multiplier for hash operation memory relative to work_mem.
postgresql_hash_mem_multiplier: "2.0"

# Memory limit for maintenance operations such as VACUUM and CREATE INDEX.
postgresql_maintenance_work_mem: "512MB"

# Memory limit used by each autovacuum worker.
postgresql_autovacuum_work_mem: "128MB"

# Temporary buffer size available per database session.
postgresql_temp_buffers: "16MB"

# Maximum temporary file usage allowed per process.
postgresql_temp_file_limit: "2GB"

################################################################################
# CPU / parallelism tuning
################################################################################

# Maximum number of background worker processes.
postgresql_max_worker_processes: 8

# Maximum number of workers available for parallel queries.
postgresql_max_parallel_workers: 4

# Maximum parallel workers usable by a single gather node.
postgresql_max_parallel_workers_per_gather: 2

# Maximum parallel workers usable by maintenance operations.
postgresql_max_parallel_maintenance_workers: 2

################################################################################
# WAL / replication / checkpoint tuning
################################################################################

# WAL level used by PostgreSQL; set to logical when logical replication is required.
postgresql_wal_level: replica

# Maximum number of concurrent WAL sender processes.
postgresql_max_wal_senders: 4

# Maximum number of replication slots.
postgresql_max_replication_slots: 4

# Maximum number of logical replication worker processes.
postgresql_max_logical_replication_workers: 4

# Maximum table synchronization workers per subscription.
postgresql_max_sync_workers_per_subscription: 2

# Keep fsync enabled to preserve durability across crashes.
postgresql_fsync: "on"

# Keep full-page writes enabled to preserve crash recovery safety.
postgresql_full_page_writes: "on"

# Commit durability mode used by PostgreSQL transactions.
postgresql_synchronous_commit: "on"

# Compress WAL records to reduce write volume on disk-backed storage.
postgresql_wal_compression: "on"

# Time interval between automatic checkpoints.
postgresql_checkpoint_timeout: "15min"

# Fraction of checkpoint interval used to spread checkpoint I/O.
postgresql_checkpoint_completion_target: "0.9"

# WAL size threshold before PostgreSQL requests a checkpoint.
postgresql_max_wal_size: "4GB"

# Lower bound for WAL files retained for future checkpoints.
postgresql_min_wal_size: "512MB"

################################################################################
# Autovacuum tuning
################################################################################

# Enable autovacuum to control table and index bloat.
postgresql_autovacuum: "on"

# Maximum number of concurrent autovacuum workers.
postgresql_autovacuum_max_workers: 2

# Delay between autovacuum launcher cycles.
postgresql_autovacuum_naptime: "1min"

# Table-change fraction that triggers vacuum activity.
postgresql_autovacuum_vacuum_scale_factor: "0.05"

# Table-change fraction that triggers analyze activity.
postgresql_autovacuum_analyze_scale_factor: "0.05"

# Delay inserted between autovacuum cost-limit accounting steps.
postgresql_autovacuum_vacuum_cost_delay: "10ms"

# Cost limit used by autovacuum workers.
postgresql_autovacuum_vacuum_cost_limit: 1000

################################################################################
# Planner / SSD-oriented defaults
################################################################################

# Planner cost estimate for non-sequential page reads on SSD-backed storage.
postgresql_random_page_cost: "1.5"

# Estimated number of concurrent disk I/O operations for regular queries.
postgresql_effective_io_concurrency: 32

# Estimated number of concurrent disk I/O operations for maintenance tasks.
postgresql_maintenance_io_concurrency: 16

################################################################################
# Locale / text / time
################################################################################

# Time zone used by PostgreSQL sessions unless overridden by clients.
postgresql_timezone: "UTC"

# Time zone used for PostgreSQL log timestamps.
postgresql_log_timezone: "UTC"

# Date and time display style used by PostgreSQL.
postgresql_datestyle: "iso, ymd"

# Locale used for PostgreSQL system error messages. Null keeps the platform/initdb default.
postgresql_lc_messages: null

# Locale used for PostgreSQL monetary formatting. Null keeps the platform/initdb default.
postgresql_lc_monetary: null

# Locale used for PostgreSQL number formatting. Null keeps the platform/initdb default.
postgresql_lc_numeric: null

# Locale used for PostgreSQL date and time formatting. Null keeps the platform/initdb default.
postgresql_lc_time: null

# Default text search configuration for new sessions.
postgresql_default_text_search_config: "pg_catalog.english"

# Password hashing method for newly stored PostgreSQL passwords.
postgresql_password_encryption: "scram-sha-256"

################################################################################
# Logging
################################################################################

# PostgreSQL log destination setting.
postgresql_log_destination: "stderr"

# Keep the internal logging collector disabled for systemd/container logging.
postgresql_logging_collector: "off"

# SQL statement classes written to the PostgreSQL log.
postgresql_log_statement: "none"

# Log statements whose runtime is at least this many milliseconds.
postgresql_log_min_duration_statement: 1000

# Log temporary files whose size is at least this threshold.
postgresql_log_temp_files: "64MB"

# Log checkpoint activity for operational visibility.
postgresql_log_checkpoints: "on"

# Log autovacuum actions whose runtime is at least this duration.
postgresql_log_autovacuum_min_duration: "1min"

################################################################################
# Additional PostgreSQL settings
################################################################################

# Additional settings that are expected to become effective after a reload.
postgresql_config_extra_reload: []
# - name: statement_timeout
#   value: "30s"

# Additional settings that are expected to require a PostgreSQL restart.
postgresql_config_extra_restart: []
# - name: shared_preload_libraries
#   value: "pg_stat_statements"

################################################################################
# PostgreSQL identity mapping
################################################################################

# Entries rendered into the fully managed pg_ident.conf file.
postgresql_pg_ident_entries: []
# - map: localmap
#   system_user: root
#   database_user: postgres

################################################################################
# Host-based authentication
################################################################################

# Entries rendered into the fully managed pg_hba.conf file.
postgresql_hba_entries:
  - type: local
    database: all
    user: postgres
    method: peer

  - type: local
    database: all
    user: all
    method: peer

  - type: host
    database: all
    user: all
    address: "127.0.0.1/32"
    method: scram-sha-256

################################################################################
# PostgreSQL roles and users
################################################################################

# PostgreSQL roles and login users managed through per-object state.
postgresql_roles: []
# - name: app
#   role_attr_flags: LOGIN
#   password: "{{ vault_postgresql_app_password }}"
#   conn_limit: 20
#   comment: Application login role

################################################################################
# PostgreSQL role memberships
################################################################################

# PostgreSQL role memberships managed through per-object state.
postgresql_memberships: []
# - groups:
#     - readonly
#   target_roles:
#     - app

################################################################################
# PostgreSQL tablespaces
################################################################################

# PostgreSQL tablespaces managed through per-object state.
postgresql_tablespaces: []
# - name: fastspace
#   location: /var/lib/postgresql/tablespaces/fastspace
#   owner: postgres

################################################################################
# PostgreSQL databases
################################################################################

# PostgreSQL databases managed through per-object state.
postgresql_databases: []
# - name: appdb
#   owner: app
#   encoding: UTF8
#   lc_collate: C.UTF-8
#   lc_ctype: C.UTF-8
#   tablespace: fastspace

################################################################################
# PostgreSQL extensions
################################################################################

# PostgreSQL extensions managed through per-object state in their target database.
postgresql_extensions: []
# - name: pg_stat_statements
#   database: appdb

################################################################################
# Logical replication publications
################################################################################

# Logical replication publications managed through per-object state in their source database.
postgresql_publications: []
# - name: app_publication
#   database: appdb
#   tables_in_schema:
#     - app
#   parameters:
#     publish: "insert, update, delete, truncate"

################################################################################
# Logical replication subscriptions
################################################################################

# Logical replication subscriptions managed through per-object state in their local database.
postgresql_subscriptions: []
# - name: app_subscription
#   database: appdb
#   connparams:
#     host: postgres-a.example.org
#     port: 5432
#     user: replicator
#     password: "{{ vault_postgresql_replicator_password }}"
#     dbname: appdb
#     sslmode: verify-full
#   publications:
#     - app_publication
#   subsparams:
#     copy_data: true
#     create_slot: true
#     enabled: true
