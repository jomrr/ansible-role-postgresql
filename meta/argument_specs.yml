---
# role: postgresql
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Install and manage PostgreSQL.
    description:
      - Installs, configures, and manages PostgreSQL runtime state.
      - Manages authentication files and declared runtime objects without global teardown,
        purge, or cleanup behavior.
      - Per-object state=absent is passed to supported community.postgresql modules when
        declared for an individual object.
    options:
      postgresql_no_log:
        type: bool
        required: false
        default: true
        description:
          - Suppress logging and diffs for PostgreSQL object and configuration tasks that
            may contain credentials.
      postgresql_listen_addresses:
        type: list
        elements: str
        required: false
        default:
          - 127.0.0.1
        description:
          - PostgreSQL listen_addresses values.
      postgresql_port:
        type: int
        required: false
        default: 5432
        description:
          - PostgreSQL TCP port.
      postgresql_max_connections:
        type: int
        required: false
        default: 50
        description:
          - Maximum concurrent PostgreSQL connections.
      postgresql_superuser_reserved_connections:
        type: int
        required: false
        default: 3
        description:
          - Connections reserved for PostgreSQL superusers.
      postgresql_shared_buffers:
        type: str
        required: false
        default: 2GB
        description:
          - Shared buffer size optimized for an 8 GB VM default profile.
      postgresql_effective_cache_size:
        type: str
        required: false
        default: 6GB
        description:
          - Planner cache estimate optimized for an 8 GB VM default profile.
      postgresql_work_mem:
        type: str
        required: false
        default: 16MB
        description:
          - Per operation work memory.
      postgresql_hash_mem_multiplier:
        type: str
        required: false
        default: '2.0'
        description:
          - Hash memory multiplier.
      postgresql_maintenance_work_mem:
        type: str
        required: false
        default: 512MB
        description:
          - Maintenance work memory.
      postgresql_autovacuum_work_mem:
        type: str
        required: false
        default: 128MB
        description:
          - Autovacuum worker memory.
      postgresql_temp_buffers:
        type: str
        required: false
        default: 16MB
        description:
          - Temporary buffer size per session.
      postgresql_temp_file_limit:
        type: str
        required: false
        default: 2GB
        description:
          - Maximum temporary file size per process.
      postgresql_max_worker_processes:
        type: int
        required: false
        default: 8
        description:
          - Maximum background worker processes.
      postgresql_max_parallel_workers:
        type: int
        required: false
        default: 4
        description:
          - Maximum parallel workers.
      postgresql_max_parallel_workers_per_gather:
        type: int
        required: false
        default: 2
        description:
          - Maximum parallel workers per gather node.
      postgresql_max_parallel_maintenance_workers:
        type: int
        required: false
        default: 2
        description:
          - Maximum parallel maintenance workers.
      postgresql_wal_level:
        type: str
        required: false
        default: replica
        choices:
          - minimal
          - replica
          - logical
        description:
          - PostgreSQL WAL level. Use logical for logical replication publishers/subscribers.
      postgresql_max_wal_senders:
        type: int
        required: false
        default: 4
        description:
          - Maximum concurrent WAL sender processes.
      postgresql_max_replication_slots:
        type: int
        required: false
        default: 4
        description:
          - Maximum replication slots.
      postgresql_max_logical_replication_workers:
        type: int
        required: false
        default: 4
        description:
          - Maximum logical replication workers.
      postgresql_max_sync_workers_per_subscription:
        type: int
        required: false
        default: 2
        description:
          - Maximum sync workers per subscription.
      postgresql_fsync:
        type: str
        required: false
        default: 'on'
        choices:
          - 'on'
          - 'off'
        description:
          - Whether fsync is enabled.
      postgresql_full_page_writes:
        type: str
        required: false
        default: 'on'
        choices:
          - 'on'
          - 'off'
        description:
          - Whether full page writes are enabled.
      postgresql_synchronous_commit:
        type: str
        required: false
        default: 'on'
        description:
          - Synchronous commit setting.
      postgresql_wal_compression:
        type: str
        required: false
        default: 'on'
        description:
          - WAL compression setting.
      postgresql_checkpoint_timeout:
        type: str
        required: false
        default: 15min
        description:
          - Checkpoint timeout.
      postgresql_checkpoint_completion_target:
        type: str
        required: false
        default: '0.9'
        description:
          - Checkpoint completion target.
      postgresql_max_wal_size:
        type: str
        required: false
        default: 4GB
        description:
          - Maximum WAL size before checkpoints.
      postgresql_min_wal_size:
        type: str
        required: false
        default: 512MB
        description:
          - Minimum WAL size.
      postgresql_autovacuum:
        type: str
        required: false
        default: 'on'
        choices:
          - 'on'
          - 'off'
        description:
          - Whether autovacuum is enabled.
      postgresql_autovacuum_max_workers:
        type: int
        required: false
        default: 2
        description:
          - Maximum autovacuum workers.
      postgresql_autovacuum_naptime:
        type: str
        required: false
        default: 1min
        description:
          - Autovacuum naptime.
      postgresql_autovacuum_vacuum_scale_factor:
        type: str
        required: false
        default: '0.05'
        description:
          - Autovacuum vacuum scale factor.
      postgresql_autovacuum_analyze_scale_factor:
        type: str
        required: false
        default: '0.05'
        description:
          - Autovacuum analyze scale factor.
      postgresql_autovacuum_vacuum_cost_delay:
        type: str
        required: false
        default: 10ms
        description:
          - Autovacuum cost delay.
      postgresql_autovacuum_vacuum_cost_limit:
        type: int
        required: false
        default: 1000
        description:
          - Autovacuum cost limit.
      postgresql_random_page_cost:
        type: str
        required: false
        default: '1.5'
        description:
          - Planner random page cost for SSD-backed VM storage.
      postgresql_effective_io_concurrency:
        type: int
        required: false
        default: 32
        description:
          - Planner effective I/O concurrency.
      postgresql_maintenance_io_concurrency:
        type: int
        required: false
        default: 16
        description:
          - Maintenance I/O concurrency.
      postgresql_timezone:
        type: str
        required: false
        default: UTC
        description:
          - PostgreSQL timezone.
      postgresql_log_timezone:
        type: str
        required: false
        default: UTC
        description:
          - PostgreSQL log timezone.
      postgresql_datestyle:
        type: str
        required: false
        default: iso, ymd
        description:
          - PostgreSQL datestyle.
      postgresql_lc_messages:
        type: str
        required: false
        default: null
        description:
          - Locale used for PostgreSQL system error messages.
      postgresql_lc_monetary:
        type: str
        required: false
        default: null
        description:
          - Locale used for PostgreSQL monetary formatting.
      postgresql_lc_numeric:
        type: str
        required: false
        default: null
        description:
          - Locale used for PostgreSQL number formatting.
      postgresql_lc_time:
        type: str
        required: false
        default: null
        description:
          - Locale used for PostgreSQL date and time formatting.
      postgresql_default_text_search_config:
        type: str
        required: false
        default: pg_catalog.english
        description:
          - Default text search configuration.
      postgresql_password_encryption:
        type: str
        required: false
        default: scram-sha-256
        description:
          - Default password encryption method.
      postgresql_ssl:
        type: str
        required: false
        default: 'off'
        choices:
          - 'on'
          - 'off'
        description:
          - Enable TLS for PostgreSQL client connections.
      postgresql_ssl_cert_file:
        type: str
        required: false
        default: null
        description:
          - Server certificate file used by PostgreSQL TLS.
      postgresql_ssl_key_file:
        type: str
        required: false
        default: null
        description:
          - Server private key file used by PostgreSQL TLS.
      postgresql_ssl_ca_file:
        type: str
        required: false
        default: null
        description:
          - Trusted CA file used for PostgreSQL client certificate validation.
      postgresql_ssl_crl_file:
        type: str
        required: false
        default: null
        description:
          - Certificate revocation list file used by PostgreSQL TLS.
      postgresql_ssl_crl_dir:
        type: str
        required: false
        default: null
        description:
          - Certificate revocation list directory used by PostgreSQL TLS.
      postgresql_ssl_ciphers:
        type: str
        required: false
        default: null
        description:
          - TLS cipher list for TLS 1.2 and older.
      postgresql_ssl_tls13_ciphers:
        type: str
        required: false
        default: null
        description:
          - TLS 1.3 cipher suites.
      postgresql_ssl_prefer_server_ciphers:
        type: str
        required: false
        default: 'on'
        choices:
          - 'on'
          - 'off'
        description:
          - Whether PostgreSQL should prefer the server cipher order.
      postgresql_ssl_min_protocol_version:
        type: str
        required: false
        default: null
        description:
          - Minimum TLS protocol version.
      postgresql_ssl_max_protocol_version:
        type: str
        required: false
        default: null
        description:
          - Maximum TLS protocol version.
      postgresql_ssl_dh_params_file:
        type: str
        required: false
        default: null
        description:
          - Diffie-Hellman parameters file used by PostgreSQL TLS.
      postgresql_ssl_passphrase_command:
        type: str
        required: false
        default: null
        description:
          - Command used to unlock passphrase-protected private keys.
      postgresql_ssl_passphrase_command_supports_reload:
        type: str
        required: false
        default: 'off'
        choices:
          - 'on'
          - 'off'
        description:
          - Whether the TLS passphrase command may be used during reload.
      postgresql_log_destination:
        type: str
        required: false
        default: stderr
        description:
          - PostgreSQL log destination.
      postgresql_logging_collector:
        type: str
        required: false
        default: 'off'
        choices:
          - 'on'
          - 'off'
        description:
          - Whether PostgreSQL logging collector is enabled.
      postgresql_log_statement:
        type: str
        required: false
        default: none
        description:
          - PostgreSQL statement logging level.
      postgresql_log_min_duration_statement:
        type: int
        required: false
        default: 1000
        description:
          - Log statements running at least this many milliseconds.
      postgresql_log_temp_files:
        type: str
        required: false
        default: 64MB
        description:
          - Log temp files above this size.
      postgresql_log_checkpoints:
        type: str
        required: false
        default: 'on'
        choices:
          - 'on'
          - 'off'
        description:
          - Whether checkpoint logging is enabled.
      postgresql_log_autovacuum_min_duration:
        type: str
        required: false
        default: 1min
        description:
          - Log autovacuum actions above this duration.
      postgresql_config_extra_reload:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - Additional PostgreSQL settings expected to become effective after a reload.
          - Entries require name and value. The optional quote flag defaults to true.
        options:
          name:
            type: str
            required: true
            description:
              - PostgreSQL setting name.
          value:
            type: raw
            required: true
            description:
              - Scalar PostgreSQL setting value.
          quote:
            type: bool
            default: true
            description:
              - Quote the value as a PostgreSQL string.
      postgresql_config_extra_restart:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - Additional PostgreSQL settings expected to require a PostgreSQL restart.
          - Entries require name and value. The optional quote flag defaults to true.
        options:
          name:
            type: str
            required: true
            description:
              - PostgreSQL setting name.
          value:
            type: raw
            required: true
            description:
              - Scalar PostgreSQL setting value.
          quote:
            type: bool
            default: true
            description:
              - Quote the value as a PostgreSQL string.
      postgresql_pg_ident_entries:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - Entries rendered into the fully managed pg_ident.conf file.
        options:
          map:
            type: str
            required: true
            description:
              - Identity map name.
          system_user:
            type: str
            required: true
            description:
              - Operating system user or PostgreSQL regular expression.
          database_user:
            type: str
            required: true
            description:
              - Mapped PostgreSQL user.
          comment:
            type: str
            description:
              - Optional rule comment.
      postgresql_hba_entries:
        type: list
        elements: dict
        required: false
        default:
          - type: local
            database: all
            user: postgres
            method: peer
          - type: host
            database: all
            user: all
            address: 127.0.0.1/32
            method: scram-sha-256
        description:
          - Entries rendered into the fully managed pg_hba.conf file.
          - The first entry must be local all postgres peer without authentication options.
        options:
          type:
            type: str
            required: true
            choices:
              - local
              - host
              - hostssl
              - hostnossl
            description:
              - Connection type.
          database:
            type: str
            required: true
            description:
              - Database selector.
          user:
            type: str
            required: true
            description:
              - PostgreSQL user selector.
          address:
            type: str
            description:
              - Address selector; required for host rules and omitted for local rules.
          method:
            type: str
            required: true
            description:
              - PostgreSQL authentication method.
          options:
            type: raw
            default: []
            description:
              - Authentication options as a string or a list of strings.
          comment:
            type: str
            description:
              - Optional rule comment.
      postgresql_roles:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - PostgreSQL roles and login users managed through per-object state.
        options:
          name:
            type: str
            description:
              - Name of the user (role) to add or remove.
            required: true
          state:
            type: str
            choices:
              - present
              - absent
            description:
              - The user (role) state.
            default: present
          login_db:
            type: str
            description:
              - Name of database to connect to and where user's permissions are granted.
          password:
            type: str
            description:
              - Set the user's password, before 1.4 this was required.
            no_log: true
          encrypted:
            type: bool
            description:
              - Whether the password is stored hashed in the database.
          role_attr_flags:
            type: str
            description:
              - 'PostgreSQL user attributes string in the format: CREATEDB,CREATEROLE,SUPERUSER.'
          conn_limit:
            type: int
            description:
              - Specifies the user (role) connection limit.
          expires:
            type: str
            description:
              - The date at which the user's password is to expire.
          comment:
            type: str
            description:
              - Adds a comment on the user (equivalent to the C(COMMENT ON ROLE) statement).
          configuration:
            type: dict
            description:
              - Role-specific configuration parameters that would otherwise be set by C(ALTER
                ROLE user SET variable TO value;).
          reset_unspecified_configuration:
            type: bool
            description:
              - If set to C(true), the user's default configuration parameters will be reset
                in case they are not included in O(configuration), otherwise existing parameters
                will not be modified if not included in O(configuration).
          fail_on_user:
            type: bool
            description:
              - If C(true), fails when the user (role) cannot be removed. Otherwise just
                log and continue.
          no_password_changes:
            type: bool
            description:
              - If C(true), does not inspect the database for password changes. If the user
                already exists, skips all password related checks. Useful when C(pg_authid)
                is not accessible (such as in AWS RDS). Otherwise, makes password changes
                as necessary.
          login_unix_socket:
            type: str
            description:
              - Unix socket directory for the management connection.
          login_port:
            type: int
            description:
              - Management port; defaults to postgresql_port.
          login_user:
            type: str
            description:
              - PostgreSQL management user.
          login_password:
            type: str
            description:
              - Password for the management connection.
            no_log: true
          login_host:
            type: str
            description:
              - Host for the management connection.
          ssl_mode:
            type: str
            choices:
              - allow
              - disable
              - prefer
              - require
              - verify-ca
              - verify-full
            description:
              - Determines how an SSL session is negotiated with the server.
      postgresql_memberships:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - PostgreSQL role memberships managed through per-object state.
        options:
          groups:
            type: list
            elements: str
            description:
              - The list of groups (roles) that need to be granted to or revoked from I(target_roles).
          group:
            type: list
            elements: str
            description:
              - Legacy spelling of groups.
          target_roles:
            type: list
            elements: str
            description:
              - The list of target roles (groups will be granted to them).
            required: true
          state:
            type: str
            choices:
              - present
              - absent
            description:
              - Membership state.
            default: present
          fail_on_role:
            type: bool
            description:
              - If C(true), fail when group or target_role doesn't exist. If C(false), just
                warn and continue.
          login_db:
            type: str
            description:
              - Name of database to connect to.
          login_unix_socket:
            type: str
            description:
              - Unix socket directory for the management connection.
          login_port:
            type: int
            description:
              - Management port; defaults to postgresql_port.
          login_user:
            type: str
            description:
              - PostgreSQL management user.
          login_password:
            type: str
            description:
              - Password for the management connection.
            no_log: true
          login_host:
            type: str
            description:
              - Host for the management connection.
          ssl_mode:
            type: str
            choices:
              - allow
              - disable
              - prefer
              - require
              - verify-ca
              - verify-full
            description:
              - TLS mode for the management connection.
      postgresql_tablespaces:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - PostgreSQL tablespaces managed through per-object state.
        options:
          name:
            type: str
            description:
              - Name of the tablespace to add or remove.
            required: true
          state:
            type: str
            choices:
              - present
              - absent
            description:
              - Tablespace state.
            default: present
          location:
            type: path
            description:
              - Path to the tablespace directory in the file system.
          owner:
            type: str
            description:
              - Name of the role to set as an owner of the tablespace.
          set:
            type: dict
            description:
              - Dict of tablespace options to set. Supported from PostgreSQL 9.0.
          login_db:
            type: str
            description:
              - Name of database to connect to and run queries against.
          login_unix_socket:
            type: str
            description:
              - Unix socket directory for the management connection.
          login_port:
            type: int
            description:
              - Management port; defaults to postgresql_port.
          login_user:
            type: str
            description:
              - PostgreSQL management user.
          login_password:
            type: str
            description:
              - Password for the management connection.
            no_log: true
          login_host:
            type: str
            description:
              - Host for the management connection.
          ssl_mode:
            type: str
            choices:
              - allow
              - disable
              - prefer
              - require
              - verify-ca
              - verify-full
            description:
              - TLS mode for the management connection.
          directory_owner:
            type: str
            description:
              - Tablespace directory owner; defaults to the PostgreSQL operating system
                user.
          directory_group:
            type: str
            description:
              - Tablespace directory group; defaults to the PostgreSQL operating system
                group.
          directory_mode:
            type: str
            default: '0700'
            description:
              - Tablespace directory permissions.
      postgresql_databases:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - PostgreSQL databases managed through per-object state.
        options:
          name:
            type: str
            description:
              - Name of the database to add or remove.
            required: true
          state:
            type: str
            choices:
              - present
              - absent
            description:
              - The database state.
            default: present
          owner:
            type: str
            description:
              - Name of the role to set as owner of the database.
          encoding:
            type: str
            description:
              - Encoding of the database.
          lc_collate:
            type: str
            description:
              - Collation order (LC_COLLATE) to use in the database must match collation
                order of template database unless C(template0) is used as template.
          lc_ctype:
            type: str
            description:
              - Character classification (LC_CTYPE) to use in the database (e.g. lower,
                upper, ...).
          locale_provider:
            type: str
            description:
              - Specifies the provider to use for the default collation in this database
                (LOCALE_PROVIDER).
          icu_locale:
            type: str
            description:
              - Specifies the ICU locale (ICU_LOCALE) for the database default collation
                order and character classification, overriding the setting locale.
          template:
            type: str
            description:
              - Template used to create the database.
          tablespace:
            type: path
            description:
              - The tablespace to set for the database U(https://www.postgresql.org/docs/current/sql-alterdatabase.html).
          conn_limit:
            type: str
            description:
              - Specifies the database connection limit.
          comment:
            type: str
            description:
              - Sets a comment on the database.
          force:
            type: bool
            description:
              - Used to forcefully drop a database when the I(state) is C(absent), ignored
                otherwise.
          maintenance_db:
            type: str
            description:
              - The value specifies the initial database (which is also called as maintenance
                DB) that Ansible connects to.
          login_unix_socket:
            type: str
            description:
              - Unix socket directory for the management connection.
          login_port:
            type: int
            description:
              - Management port; defaults to postgresql_port.
          login_user:
            type: str
            description:
              - PostgreSQL management user.
          login_password:
            type: str
            description:
              - Password for the management connection.
            no_log: true
          login_host:
            type: str
            description:
              - Host for the management connection.
          ssl_mode:
            type: str
            choices:
              - allow
              - disable
              - prefer
              - require
              - verify-ca
              - verify-full
            description:
              - TLS mode for the management connection.
      postgresql_extensions:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - PostgreSQL extensions managed through per-object state in their target database.
        options:
          name:
            type: str
            description:
              - Name of the extension to add or remove.
            required: true
          state:
            type: str
            choices:
              - present
              - absent
            description:
              - The database extension state.
            default: present
          database:
            type: str
            description:
              - Name of the database to add or remove the extension to/from.
            required: true
          schema:
            type: str
            description:
              - Name of the schema to add the extension to.
          version:
            type: str
            description:
              - Extension version to add or update to. Has effect with I(state=present)
                only.
          cascade:
            type: bool
            description:
              - Automatically install/remove any extensions that this extension depends
                on that are not already installed/removed (supported since PostgreSQL 9.6).
          comment:
            type: str
            description:
              - Sets a comment on the extension.
          login_unix_socket:
            type: str
            description:
              - Path to a Unix domain socket for local connections.
          login_port:
            type: int
            description:
              - Management port; defaults to postgresql_port.
          login_user:
            type: str
            description:
              - PostgreSQL management user.
          login_password:
            type: str
            description:
              - Password for the management connection.
            no_log: true
          login_host:
